[project]
name = "aibench"
version = "0.1.0"
description = "Benchmark how AI answer engines recommend a brand vs its competitors"
requires-python = ">=3.10"
dependencies = ["pyyaml", "pandas", "httpx", "openpyxl"]   # engines are called over plain HTTPS; no vendor SDKs

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
